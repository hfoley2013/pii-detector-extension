name: Publish to Chrome Web Store

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v1.0.1, etc.
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update manifest version
        run: |
          # Update version in manifest.json to match tag
          jq '.version = "${{ steps.version.outputs.version }}"' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json

      - name: Create extension zip
        run: |
          zip -r extension.zip \
            manifest.json \
            src/ \
            assets/ \
            -x "*.DS_Store" \
            -x "*.git*" \
            -x "*node_modules*" \
            -x "*scripts*" \
            -x "*tests*"

      - name: Upload to Chrome Web Store
        uses: mobilefirstllc/cws-publish@latest
        with:
          action: publish
          client_id: ${{ secrets.CHROME_CLIENT_ID }}
          client_secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh_token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          extension_id: ${{ secrets.CHROME_EXTENSION_ID }}
          zip_file: extension.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ steps.version.outputs.version }}
          path: extension.zip
