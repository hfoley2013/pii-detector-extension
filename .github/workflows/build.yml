name: Build Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create extension zip
        run: |
          zip -r pii-detector-extension.zip \
            manifest.json \
            src/ \
            assets/ \
            -x "*.DS_Store" \
            -x "*.git*" \
            -x "*node_modules*" \
            -x "*scripts*" \
            -x "*tests*" \
            -x "*.md"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pii-detector-extension
          path: pii-detector-extension.zip
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from manifest
        id: version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pii-detector-extension

      - name: Create or update latest release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Build
          body: |
            ## Latest Development Build

            **Version:** ${{ steps.version.outputs.version }}
            **Commit:** ${{ github.sha }}
            **Built:** ${{ github.event.head_commit.timestamp }}

            ### Installation
            1. Download `pii-detector-extension.zip` below
            2. Unzip to a folder
            3. Go to `chrome://extensions/`
            4. Enable "Developer mode"
            5. Click "Load unpacked" and select the unzipped folder

            ### Auto-Update
            To get the latest version, re-download and reload the extension.
          files: pii-detector-extension.zip
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
